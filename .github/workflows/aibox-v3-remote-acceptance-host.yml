name: AI BOX V3 Remote Acceptance Host

on:
  push:
    branches: [18.0]
    paths:
      - '.aibox-v3-remote-trigger'

permissions:
  contents: read

jobs:
  host:
    if: github.actor == 'gnomedev-gvs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Host temporary private controller node
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_TOKEN: ${{ secrets.AIBOX_REMOTE_ACCEPTANCE_CONTROL_TOKEN }}
          EXEC_TOKEN: ${{ secrets.AIBOX_REMOTE_ACCEPTANCE_EXEC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          CONTROL_REPO='gnomedev-gvs/aibox-control'
          CONTROL_URL="https://github.com/$CONTROL_REPO"
          NODE_ID='remote-01'
          RUNTIME_ROOT="$HOME/.local/share/aibox-control/remote-acceptance/$NODE_ID"
          CACHE_DIR="$HOME/.cache/aibox-control/runner-dist"

          [[ -n "$CONTROL_TOKEN" ]] || { echo 'missing control registration token' >&2; exit 1; }
          [[ -n "$EXEC_TOKEN" ]] || { echo 'missing execution registration token' >&2; exit 1; }
          mkdir -p "$RUNTIME_ROOT/pids" "$RUNTIME_ROOT/logs" "$CACHE_DIR"

          listener_pids() {
            local slot="$1" root="$RUNTIME_ROOT/$1"
            python3 - "$root" <<'PY'
import os,sys
root=os.path.realpath(sys.argv[1])
for entry in os.listdir('/proc'):
    if not entry.isdigit():
        continue
    try:
        comm=open(f'/proc/{entry}/comm').read().strip()
        cwd=os.path.realpath(os.readlink(f'/proc/{entry}/cwd'))
    except (FileNotFoundError, PermissionError, ProcessLookupError, OSError):
        continue
    if comm == 'Runner.Listener' and cwd == root:
        print(entry)
PY
          }

          listener_alive() {
            [[ -n "$(listener_pids "$1")" ]]
          }

          wrapper_alive() {
            local pidfile="$RUNTIME_ROOT/pids/$1.pid" pid
            [[ -s "$pidfile" ]] || return 1
            pid="$(cat "$pidfile")"
            [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null
          }

          slot_alive() {
            listener_alive "$1" || wrapper_alive "$1"
          }

          cleanup() {
            set +e
            for slot in exec-01 control-01; do
              while read -r pid; do
                [[ -n "$pid" ]] && kill -INT "$pid" 2>/dev/null || true
              done < <(listener_pids "$slot")
              pidfile="$RUNTIME_ROOT/pids/$slot.pid"
              if [[ -s "$pidfile" ]]; then
                pid="$(cat "$pidfile")"
                [[ "$pid" =~ ^[0-9]+$ ]] && kill -INT "$pid" 2>/dev/null || true
              fi
            done
            sleep 2
            for slot in exec-01 control-01; do
              while read -r pid; do
                [[ -n "$pid" ]] && kill -TERM "$pid" 2>/dev/null || true
              done < <(listener_pids "$slot")
            done
          }
          trap cleanup EXIT INT TERM

          echo '[remote-host] resolving GitHub Actions runner release'
          tag="$(gh api repos/actions/runner/releases/latest --jq '.tag_name')"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected runner release tag: $tag" >&2; exit 1; }
          ver="${tag#v}"
          asset="actions-runner-linux-x64-${ver}.tar.gz"
          archive="$CACHE_DIR/$asset"
          if [[ ! -s "$archive" ]]; then
            tmp="$(mktemp)"
            curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 \
              "https://github.com/actions/runner/releases/download/${tag}/${asset}" -o "$tmp"
            digest="$(gh api repos/actions/runner/releases/latest --jq ".assets[] | select(.name == \"${asset}\") | .digest // empty")"
            [[ "$digest" == sha256:* ]] || { echo 'runner asset digest unavailable' >&2; exit 1; }
            expected="${digest#sha256:}"
            actual="$(sha256sum "$tmp" | awk '{print $1}')"
            [[ "$expected" == "$actual" ]] || { echo 'runner archive SHA-256 mismatch' >&2; exit 1; }
            mv "$tmp" "$archive"
          fi

          configure_slot() {
            local slot="$1" token="$2" runner_name="$3" labels="$4" root="$RUNTIME_ROOT/$1"
            rm -rf "$root"
            mkdir -p "$root"
            tar xzf "$archive" -C "$root"
            (cd "$root" && ./config.sh --unattended --replace --url "$CONTROL_URL" --token "$token" --name "$runner_name" --labels "$labels" --work '_work')
          }

          start_slot() {
            local slot="$1" root="$RUNTIME_ROOT/$1" pidfile="$RUNTIME_ROOT/pids/$1.pid" logfile="$RUNTIME_ROOT/logs/$1.log"
            rm -f "$pidfile"
            (
              cd "$root"
              env -u GH_TOKEN -u GITHUB_TOKEN -u CONTROL_TOKEN -u EXEC_TOKEN \
                AIBOX_NODE_ID="$NODE_ID" AIBOX_REMOTE_ACCEPTANCE_ROOT="$RUNTIME_ROOT" \
                ./run.sh >>"$logfile" 2>&1 &
              echo $! > "$pidfile"
            )
          }

          wait_slot() {
            local slot="$1"
            for _ in $(seq 1 15); do
              slot_alive "$slot" && return 0
              sleep 1
            done
            return 1
          }

          restore_slot() {
            local slot="$1"
            if ! slot_alive "$slot"; then
              echo "REMOTE_NODE_RECOVERY slot=$slot action=restart"
              start_slot "$slot"
              wait_slot "$slot" || { echo "failed to restore $slot" >&2; return 1; }
              echo "REMOTE_NODE_RECOVERY slot=$slot result=restored"
            fi
          }

          configure_slot control-01 "$CONTROL_TOKEN" "ghvm-${GITHUB_RUN_ID}-control-01" "omk-control,aibox-control,node-$NODE_ID,omk-node-admin"
          configure_slot exec-01 "$EXEC_TOKEN" "ghvm-${GITHUB_RUN_ID}-$NODE_ID-exec-01" "omk-exec,node-$NODE_ID,class-heavy,class-standard,class-light,cap-general-compute,cap-runner-admin"
          unset CONTROL_TOKEN EXEC_TOKEN

          start_slot control-01
          start_slot exec-01
          wait_slot control-01 || { echo 'control listener failed initial startup' >&2; exit 1; }
          wait_slot exec-01 || { echo 'execution listener failed initial startup' >&2; exit 1; }
          echo "REMOTE_NODE_READY node=$NODE_ID host=$(hostname) control=control-01 exec=exec-01"

          for _ in $(seq 1 750); do
            restore_slot control-01
            restore_slot exec-01
            sleep 2
          done
